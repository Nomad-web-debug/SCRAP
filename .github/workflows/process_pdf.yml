name: Procesar PDFs Locales

on:
  workflow_dispatch:
    inputs:
      pdf_path:
        description: 'Ruta al archivo PDF a procesar'
        required: true
        default: 'pdfs/'
      aws_region:
        description: 'Región de AWS'
        required: true
        default: 'us-east-1'
      modelo:
        description: 'Modelo a utilizar (7b, 13b, 70b)'
        required: true
        default: '13b'
        type: choice
        options:
          - '7b'
          - '13b'
          - '70b'

env:
  AWS_REGION: ${{ inputs.aws_region }}
  MODELO: ${{ inputs.modelo }}

jobs:
  process-pdf:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Configurar credenciales AWS
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
        aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
        aws configure set region $AWS_REGION
    
    - name: Procesar PDF
      run: |
        ENDPOINT_NAME="llama-2-$MODELO-endpoint"
        MODEL_NAME="llama-2-$MODELO-chat"
        echo "Usando endpoint: $ENDPOINT_NAME (Modelo: Llama 2 $MODELO)"
        python scripts/process_with_llama.py \
          --input-dir "${{ inputs.pdf_path }}" \
          --output-dir "estructurados_local" \
          --endpoint $ENDPOINT_NAME \
          --model $MODEL_NAME 