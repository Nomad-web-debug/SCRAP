name: 1. Deploy Infrastructure

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/1-deploy-infrastructure.yml'
  workflow_dispatch:

env:
  TF_WORKSPACE: prod
  AWS_REGION: us-east-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      bucket: ${{ steps.tf-outputs.outputs.bucket }}
      db_host: ${{ steps.tf-outputs.outputs.db_host }}
      db_port: ${{ steps.tf-outputs.outputs.db_port }}
      db_name: ${{ steps.tf-outputs.outputs.db_name }}
      db_user: ${{ steps.tf-outputs.outputs.db_user }}
    
    steps:
    - uses: actions/checkout@v2

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v1

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init

    - name: Terraform Plan
      working-directory: ./terraform
      run: terraform plan -out=tfplan
      
    - name: Check Plan Status
      if: steps.plan.outcome == 'failure'
      run: exit 1

    - name: Terraform Apply
      working-directory: ./terraform
      run: terraform apply -auto-approve tfplan

    - name: Get Infrastructure Outputs
      id: tf-outputs
      working-directory: ./terraform
      run: |
        # Esperar un momento para asegurar que los outputs estén disponibles
        sleep 10
        
        # Obtener y validar cada output individualmente
        BUCKET=$(terraform output -raw s3_bucket || echo "")
        DB_HOST=$(terraform output -raw db_host || echo "")
        DB_PORT=$(terraform output -raw db_port || echo "")
        DB_NAME=$(terraform output -raw db_name || echo "")
        DB_USER=$(terraform output -raw db_user || echo "")
        
        # Validar que tenemos los valores necesarios
        if [ -z "$BUCKET" ]; then
          echo "Error: No se pudo obtener el nombre del bucket"
          exit 1
        fi
        
        if [ -z "$DB_HOST" ]; then
          echo "Error: No se pudo obtener el host de la base de datos"
          exit 1
        fi
        
        # Guardar los outputs validados
        echo "bucket=${BUCKET}" >> $GITHUB_OUTPUT
        echo "db_host=${DB_HOST}" >> $GITHUB_OUTPUT
        echo "db_port=${DB_PORT}" >> $GITHUB_OUTPUT
        echo "db_name=${DB_NAME}" >> $GITHUB_OUTPUT
        echo "db_user=${DB_USER}" >> $GITHUB_OUTPUT
        
        # Imprimir valores para verificación (sin credenciales sensibles)
        echo "Bucket name: ${BUCKET}"
        echo "Database host: ${DB_HOST}"

    - name: Create Config File
      run: |
        cat > app/config.py << EOF
        import os
        
        class ProcessingConfig:
            anthropic_api_key = os.getenv('ANTHROPIC_API_KEY')
            db_host = '${{ steps.tf-outputs.outputs.db_host }}'
            db_port = '${{ steps.tf-outputs.outputs.db_port }}'
            db_name = '${{ steps.tf-outputs.outputs.db_name }}'
            db_user = '${{ steps.tf-outputs.outputs.db_user }}'
            db_password = os.getenv('DB_PASSWORD')
        
        processing_config = ProcessingConfig()
        
        LOGGING_CONFIG = {
            'version': 1,
            'formatters': {
                'standard': {
                    'format': '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
                },
            },
            'handlers': {
                'default': {
                    'level': 'INFO',
                    'formatter': 'standard',
                    'class': 'logging.StreamHandler',
                },
            },
            'loggers': {
                '': {
                    'handlers': ['default'],
                    'level': 'INFO',
                    'propagate': True
                }
            }
        }
        EOF

    - name: Apply Database Schema
      run: |
        PGPASSWORD=${{ secrets.DB_PASSWORD }} psql -h ${{ steps.tf-outputs.outputs.db_host }} \
          -U ${{ steps.tf-outputs.outputs.db_user }} \
          -d ${{ steps.tf-outputs.outputs.db_name }} \
          -f db/schema.sql 