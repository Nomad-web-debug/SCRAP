name: Process PDFs with Llama

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  MODELO: 13b
  OUTPUT_DIR: estructurados_local

jobs:
  process-pdfs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyMuPDF boto3 pandas
        
    - name: Configure AWS credentials
      run: |
        aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws configure set region $AWS_REGION
        
    - name: Create output directories
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        mkdir -p public
        chmod -R 777 ${{ env.OUTPUT_DIR }}
        chmod -R 777 public
        
    - name: Process PDFs
      run: |
        ENDPOINT_NAME="llama-2-$MODELO-endpoint"
        MODEL_NAME="llama-2-$MODELO-chat"
        echo "Usando endpoint: $ENDPOINT_NAME (Modelo: Llama 2 $MODELO)"
        python scripts/process_with_llama.py \
          --input-dir "pdfs/" \
          --output-dir "${{ env.OUTPUT_DIR }}" \
          --endpoint $ENDPOINT_NAME \
          --model $MODEL_NAME
          
    - name: Copy results to public directory
      run: |
        cp -r ${{ env.OUTPUT_DIR }}/* public/
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4 