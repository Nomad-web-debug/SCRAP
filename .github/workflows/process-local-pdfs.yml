name: Process PDFs with Llama

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  MODELO: 13b
  OUTPUT_DIR: estructurados_local

jobs:
  process-pdfs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyMuPDF boto3 pandas
        
    - name: Configure AWS credentials
      run: |
        aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws configure set region $AWS_REGION
        
    - name: Create output directories
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        mkdir -p public
        chmod -R 777 ${{ env.OUTPUT_DIR }}
        chmod -R 777 public
        
    - name: Process PDFs
      run: |
        ENDPOINT_NAME="llama-2-$MODELO-endpoint"
        MODEL_NAME="llama-2-$MODELO-chat"
        echo "Usando endpoint: $ENDPOINT_NAME (Modelo: Llama 2 $MODELO)"
        python scripts/process_with_llama.py \
          --input-dir "pdfs/" \
          --output-dir "${{ env.OUTPUT_DIR }}" \
          --endpoint $ENDPOINT_NAME \
          --model $MODEL_NAME
          
    - name: Prepare public directory
      run: |
        # Crear index.html básico
        cat > public/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
            <title>Resultados del Procesamiento</title>
            <meta charset="UTF-8">
            <style>
                body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
                .container { padding: 20px; }
                .status { padding: 15px; margin: 10px 0; border-radius: 5px; }
                .success { background-color: #e8f5e9; color: #2e7d32; }
                .error { background-color: #ffebee; color: #c62828; }
            </style>
        </head>
        <body>
            <div class="container">
                <h1>Resultados del Procesamiento de PDFs</h1>
                <div class="status" id="status">
                    Procesando...
                </div>
                <div id="results">
                </div>
            </div>
        </body>
        </html>
        EOF
        
        # Intentar copiar los resultados si existen
        if [ -d "${{ env.OUTPUT_DIR }}" ] && [ "$(ls -A ${{ env.OUTPUT_DIR }})" ]; then
          cp -r ${{ env.OUTPUT_DIR }}/* public/
          echo "Archivos copiados exitosamente"
        else
          echo "No hay archivos para copiar en ${{ env.OUTPUT_DIR }}"
          # Actualizar el estado en index.html
          sed -i 's/Procesando.../No se encontraron resultados del procesamiento./g' public/index.html
        fi
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4 