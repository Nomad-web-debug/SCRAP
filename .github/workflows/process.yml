name: Process Documents

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  process:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
          
      - name: Verify and process files
        run: |
          echo "Verificando archivos antes del procesamiento..."
          python -c "import boto3,os; s3=boto3.client('s3'); bucket=os.getenv('BUCKET_NAME'); raw=s3.list_objects_v2(Bucket=bucket,Prefix='raw/'); print('No hay archivos para procesar' if not raw.get('Contents') else f'Encontrados {len(raw[\"Contents\"])} archivos para procesar')"
          
          echo "Iniciando procesamiento..."
          python scripts/processor.py
        env:
          AWS_REGION: us-east-2
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUCKET_NAME: clasificador-docs-principal
          AWS_DEFAULT_REGION: us-east-2
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }} 