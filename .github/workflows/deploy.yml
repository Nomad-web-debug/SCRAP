name: Deploy Application

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  TF_WORKSPACE: prod
  AWS_REGION: us-east-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: 1.5.0

    - name: Package Application
      run: |
        zip -r app.zip app/ scripts/ requirements.txt

    - name: Terraform Init
      id: init
      run: |
        cd terraform
        terraform init -input=false

    - name: Terraform Plan
      id: plan
      run: |
        cd terraform
        terraform plan -input=false -out=tfplan
      continue-on-error: true

    - name: Terraform Plan Status
      if: steps.plan.outcome == 'failure'
      run: exit 1

    - name: Terraform Apply and Get Outputs
      id: terraform
      run: |
        cd terraform
        terraform apply -auto-approve tfplan
        echo "bucket_name=$(terraform output -raw s3_bucket)" >> "$GITHUB_ENV"

    - name: Upload Application to S3
      run: |
        bucket_name="${{ env.bucket_name }}"
        if [ -z "$bucket_name" ]; then
          echo "Error: No se pudo obtener el nombre del bucket"
          exit 1
        fi
        
        echo "Subiendo archivos al bucket: $bucket_name"
        aws s3 cp app.zip "s3://$bucket_name/app.zip"
        aws s3 cp scripts/init.sh "s3://$bucket_name/init.sh"
        aws s3 cp scripts/check_idle.sh "s3://$bucket_name/check_idle.sh" 