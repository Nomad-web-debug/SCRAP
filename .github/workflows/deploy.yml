name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: |
          requirements-lambda.txt
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel setuptools

    - name: Create Lambda Layer
      run: |
        # Crear directorio para la capa
        mkdir -p lambda_layer/python
        cd lambda_layer/python
        
        # Instalar dependencias en la capa
        pip install \
          --platform manylinux2014_x86_64 \
          --target . \
          --implementation cp \
          --python-version 3.12 \
          --only-binary=:all: \
          anthropic==0.18.1 \
          transformers==4.38.2 \
          torch==2.2.1 \
          sentence-transformers==2.5.1
        
        # Limpiar archivos innecesarios
        find . -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
        find . -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
        find . -type d -name "docs" -exec rm -rf {} + 2>/dev/null || true
        find . -type f -name "*.pyc" -delete 2>/dev/null || true
        find . -type f -name "*.pyo" -delete 2>/dev/null || true
        find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
        
        # Crear ZIP de la capa
        cd ..
        zip -r9 lambda_layer.zip python/
        cd ..
    
    - name: Create deployment package
      run: |
        # Crear directorio temporal para el paquete
        mkdir -p package
        
        # Copiar archivos necesarios
        cp lambda_function.py package/
        cp scraper.py package/
        cp processor.py package/
        cp database.py package/
        cp storage.py package/
        
        cd package
        
        # Instalar solo dependencias ligeras
        pip install \
          --platform manylinux2014_x86_64 \
          --target . \
          --implementation cp \
          --python-version 3.12 \
          --only-binary=:all: \
          boto3==1.34.34 \
          python-dotenv==1.0.1 \
          requests==2.31.0 \
          pandas==2.2.1 \
          PyPDF2==3.0.1 \
          beautifulsoup4==4.12.3
        
        # Limpiar archivos innecesarios
        find . -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
        find . -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
        find . -type d -name "docs" -exec rm -rf {} + 2>/dev/null || true
        find . -type f -name "*.pyc" -delete 2>/dev/null || true
        find . -type f -name "*.pyo" -delete 2>/dev/null || true
        find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
        
        # Crear ZIP del paquete principal
        zip -r9 ../deployment.zip . -x "*.pyc" "*.pyo" "*/__pycache__/*" "*.dist-info/*" "*.egg-info/*"
        cd ..
        
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Update Lambda Layer
      run: |
        # Publicar nueva versión de la capa
        LAYER_VERSION=$(aws lambda publish-layer-version \
          --layer-name ClasificadorDependencies \
          --description "Dependencies for ClasificadorDocumentosIA" \
          --zip-file fileb://lambda_layer.zip \
          --compatible-runtimes python3.12 \
          --query 'Version' \
          --output text)
        
        echo "Nueva versión de capa creada: $LAYER_VERSION"
        
        # Guardar ARN de la capa
        LAYER_ARN=$(aws lambda list-layer-versions \
          --layer-name ClasificadorDependencies \
          --query 'LayerVersions[0].LayerVersionArn' \
          --output text)
        
        echo "Layer ARN: $LAYER_ARN"
        echo "LAYER_ARN=$LAYER_ARN" >> $GITHUB_ENV

    - name: Update Lambda Function
      run: |
        # Verificar tamaño del paquete
        PACKAGE_SIZE=$(stat -c%s deployment.zip)
        echo "Tamaño del paquete: $PACKAGE_SIZE bytes"
        
        if [ $PACKAGE_SIZE -gt 50000000 ]; then
          echo "Error: El paquete es demasiado grande (>50MB). Debe optimizarse."
          exit 1
        fi
        
        # Actualizar función Lambda
        aws lambda update-function-code \
          --function-name ClasificadorDocumentosIA \
          --zip-file fileb://deployment.zip
        
        # Actualizar configuración con la nueva capa
        aws lambda update-function-configuration \
          --function-name ClasificadorDocumentosIA \
          --layers $LAYER_ARN \
          --timeout 900 \
          --memory-size 2048 \
          --environment "Variables={
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }},
            S3_BUCKET=clasificador-docs-raw,
            DYNAMODB_METADATA_TABLE=DocumentosMetadata,
            DYNAMODB_TRAINING_TABLE=TrainingData,
            DYNAMODB_CHAT_TABLE=ChatHistory
          }"

    - name: Create S3 Buckets
      run: |
        # Bucket para documentos originales
        aws s3api create-bucket \
          --bucket clasificador-docs-raw \
          --region us-east-2 \
          --create-bucket-configuration LocationConstraint=us-east-2 || true
        
        # Bucket para datos procesados
        aws s3api create-bucket \
          --bucket clasificador-docs-processed \
          --region us-east-2 \
          --create-bucket-configuration LocationConstraint=us-east-2 || true
        
        # Bucket para modelos entrenados
        aws s3api create-bucket \
          --bucket clasificador-models \
          --region us-east-2 \
          --create-bucket-configuration LocationConstraint=us-east-2 || true
        
        # Habilitar versionamiento
        for bucket in clasificador-docs-raw clasificador-docs-processed clasificador-models; do
          aws s3api put-bucket-versioning \
            --bucket $bucket \
            --versioning-configuration Status=Enabled
        done

    - name: Create DynamoDB Tables
      run: |
        # Tabla para metadatos de documentos
        aws dynamodb create-table \
          --table-name DocumentosMetadata \
          --attribute-definitions \
              AttributeName=id,AttributeType=S \
              AttributeName=fecha,AttributeType=S \
          --key-schema \
              AttributeName=id,KeyType=HASH \
              AttributeName=fecha,KeyType=RANGE \
          --provisioned-throughput \
              ReadCapacityUnits=5,WriteCapacityUnits=5 || true
        
        # Tabla para datos de entrenamiento
        aws dynamodb create-table \
          --table-name TrainingData \
          --attribute-definitions \
              AttributeName=id,AttributeType=S \
          --key-schema \
              AttributeName=id,KeyType=HASH \
          --provisioned-throughput \
              ReadCapacityUnits=5,WriteCapacityUnits=5 || true
        
        # Tabla para chat
        aws dynamodb create-table \
          --table-name ChatHistory \
          --attribute-definitions \
              AttributeName=session_id,AttributeType=S \
              AttributeName=timestamp,AttributeType=N \
          --key-schema \
              AttributeName=session_id,KeyType=HASH \
              AttributeName=timestamp,KeyType=RANGE \
          --provisioned-throughput \
              ReadCapacityUnits=5,WriteCapacityUnits=5 || true

    - name: Create SageMaker Notebook
      run: |
        aws sagemaker create-notebook-instance \
          --notebook-instance-name ClasificadorNotebook \
          --instance-type ml.t3.medium \
          --role-arn arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/service-role/AmazonSageMaker-ExecutionRole \
          --volume-size-in-gb 50 || true

    - name: Create API Gateway
      run: |
        # Crear API REST
        api_id=$(aws apigateway create-rest-api \
          --name ClasificadorAPI \
          --description "API para el clasificador de documentos" \
          --query 'id' --output text || true) 