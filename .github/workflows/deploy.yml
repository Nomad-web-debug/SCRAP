name: Deploy Application

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: 1.5.0

    - name: Package Application
      run: |
        zip -r app.zip app/ scripts/ requirements.txt

    - name: Terraform Init
      id: init
      run: |
        cd terraform
        terraform init -input=false
      continue-on-error: true

    - name: Terraform Workspace
      if: steps.init.outcome == 'success'
      run: |
        cd terraform
        terraform workspace new prod || terraform workspace select prod

    - name: Terraform Plan
      if: steps.init.outcome == 'success'
      run: |
        cd terraform
        terraform plan -input=false -out=tfplan

    - name: Terraform Apply
      if: steps.init.outcome == 'success'
      run: |
        cd terraform
        terraform apply -auto-approve tfplan

    - name: Upload Application to S3
      if: steps.init.outcome == 'success'
      run: |
        BUCKET_NAME=$(cd terraform && terraform output -raw s3_bucket)
        aws s3 cp app.zip s3://$BUCKET_NAME/
        aws s3 cp scripts/init.sh s3://$BUCKET_NAME/
        aws s3 cp scripts/check_idle.sh s3://$BUCKET_NAME/ 