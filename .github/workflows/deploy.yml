name: Deploy Application

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  TF_WORKSPACE: prod
  AWS_REGION: us-east-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Package Application
      run: |
        zip -r app.zip app/ scripts/ requirements.txt

    - name: Terraform Init
      id: init
      run: |
        cd terraform
        terraform init -input=false
      continue-on-error: false

    - name: Terraform Plan
      id: plan
      run: |
        cd terraform
        terraform plan -input=false -out=tfplan
      continue-on-error: false

    - name: Terraform Apply
      id: apply
      run: |
        cd terraform
        terraform apply -auto-approve tfplan

    - name: Get Bucket Name
      id: bucket
      working-directory: terraform
      run: |
        echo "bucket=$(terraform output -raw s3_bucket)" >> "$GITHUB_OUTPUT"

    - name: Upload to S3
      if: success()
      env:
        BUCKET: ${{ steps.bucket.outputs.bucket }}
      run: |
        echo "Subiendo archivos al bucket: $BUCKET"
        aws s3 cp app.zip "s3://$BUCKET/app.zip"
        aws s3 cp scripts/init.sh "s3://$BUCKET/init.sh"
        aws s3 cp scripts/check_idle.sh "s3://$BUCKET/check_idle.sh"

    - name: Verificar Despliegue
      if: success()
      run: |
        echo "Infraestructura desplegada correctamente"
        echo "Bucket S3: ${{ steps.bucket.outputs.bucket }}"
        echo "Región: ${{ env.AWS_REGION }}"

    - name: Cleanup on Failure
      if: failure()
      run: |
        echo "El despliegue falló. Iniciando limpieza..."
        cd terraform
        terraform destroy -auto-approve || true 