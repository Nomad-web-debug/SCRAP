name: Deploy Application

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  TF_WORKSPACE: prod
  AWS_REGION: us-east-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: 1.5.0

    - name: Package Application
      run: |
        zip -r app.zip app/ scripts/ requirements.txt

    - name: Terraform Init
      run: |
        cd terraform
        terraform init -input=false

    - name: Terraform Plan
      run: |
        cd terraform
        terraform plan -input=false -out=tfplan

    - name: Terraform Apply
      run: |
        cd terraform
        terraform apply -auto-approve tfplan

    - name: Get Bucket Name
      id: bucket
      working-directory: terraform
      run: |
        # Guardar la salida en un archivo temporal
        terraform output -raw s3_bucket > bucket_name.txt
        # Leer el archivo y validar el nombre
        BUCKET_NAME=$(cat bucket_name.txt)
        if [[ -n "$BUCKET_NAME" && "$BUCKET_NAME" =~ ^[a-zA-Z0-9\._-]+$ ]]; then
          echo "bucket=$BUCKET_NAME" >> "$GITHUB_OUTPUT"
        else
          echo "Error: Nombre de bucket inválido: $BUCKET_NAME"
          exit 1
        fi

    - name: Upload to S3
      if: steps.bucket.outputs.bucket != ''
      run: |
        echo "Subiendo archivos al bucket: ${{ steps.bucket.outputs.bucket }}"
        aws s3 cp app.zip "s3://${{ steps.bucket.outputs.bucket }}/app.zip"
        aws s3 cp scripts/init.sh "s3://${{ steps.bucket.outputs.bucket }}/init.sh"
        aws s3 cp scripts/check_idle.sh "s3://${{ steps.bucket.outputs.bucket }}/check_idle.sh"

    - name: Verificar Despliegue
      if: steps.bucket.outputs.bucket != ''
      run: |
        echo "Infraestructura desplegada correctamente"
        echo "Bucket S3: ${{ steps.bucket.outputs.bucket }}"
        echo "Región: ${{ env.AWS_REGION }}" 