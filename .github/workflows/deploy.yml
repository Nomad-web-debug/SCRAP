name: Deploy Application

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  TF_WORKSPACE: prod
  AWS_REGION: us-east-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: 1.5.0

    - name: Package Application
      run: |
        zip -r app.zip app/ scripts/ requirements.txt

    - name: Terraform Init
      run: |
        cd terraform
        terraform init -input=false

    - name: Terraform Plan
      run: |
        cd terraform
        terraform plan -input=false -out=tfplan

    - name: Terraform Apply
      run: |
        cd terraform
        terraform apply -auto-approve tfplan

    - name: Save Bucket Name
      run: |
        cd terraform
        BUCKET_NAME=$(terraform output -raw s3_bucket)
        echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV

    - name: Upload to S3
      run: |
        if [[ -n "$BUCKET_NAME" && "$BUCKET_NAME" =~ ^[a-zA-Z0-9\._-]+$ ]]; then
          echo "Subiendo archivos al bucket: $BUCKET_NAME"
          aws s3 cp app.zip "s3://$BUCKET_NAME/app.zip"
          aws s3 cp scripts/init.sh "s3://$BUCKET_NAME/init.sh"
          aws s3 cp scripts/check_idle.sh "s3://$BUCKET_NAME/check_idle.sh"
        else
          echo "Error: Nombre de bucket inválido: $BUCKET_NAME"
          exit 1
        fi

    - name: Verificar Despliegue
      run: |
        echo "Infraestructura desplegada correctamente"
        echo "Bucket S3: $BUCKET_NAME"
        echo "Región: ${{ env.AWS_REGION }}" 