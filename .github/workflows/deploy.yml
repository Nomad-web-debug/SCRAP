name: Deploy Application

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  TF_WORKSPACE: prod
  AWS_REGION: us-east-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Package Application
      run: |
        zip -r app.zip app/ scripts/ requirements.txt

    - name: Terraform Init
      id: init
      run: |
        cd terraform
        terraform init -input=false
      continue-on-error: false

    - name: Terraform Plan
      id: plan
      run: |
        cd terraform
        terraform plan -input=false -out=tfplan
      continue-on-error: false

    - name: Terraform Apply
      id: apply
      run: |
        cd terraform
        terraform apply -auto-approve tfplan

    - name: Get Bucket Name
      id: bucket
      shell: bash
      working-directory: terraform
      run: |
        # Obtener el nombre del bucket y mostrarlo para debug
        echo "Obteniendo outputs de Terraform..."
        terraform output
        
        echo "Obteniendo nombre del bucket..."
        BUCKET_NAME=$(terraform output -raw s3_bucket || echo "")
        
        echo "Nombre del bucket obtenido: '$BUCKET_NAME'"
        
        if [[ -n "$BUCKET_NAME" ]]; then
          echo "bucket=$BUCKET_NAME" >> "$GITHUB_OUTPUT"
          echo "BUCKET_NAME=$BUCKET_NAME" >> "$GITHUB_ENV"
          echo "✓ Nombre del bucket guardado: $BUCKET_NAME"
        else
          echo "✗ Error: No se pudo obtener el nombre del bucket"
          exit 1
        fi

    - name: Upload to S3
      if: success() && steps.bucket.outputs.bucket != ''
      run: |
        BUCKET="${{ steps.bucket.outputs.bucket }}"
        echo "Intentando acceder al bucket: $BUCKET"
        
        # Esperar hasta 30 segundos para que el bucket esté disponible
        for i in {1..6}; do
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "✓ Bucket accesible, procediendo con la carga..."
            aws s3 cp app.zip "s3://$BUCKET/app.zip"
            aws s3 cp scripts/init.sh "s3://$BUCKET/init.sh"
            aws s3 cp scripts/check_idle.sh "s3://$BUCKET/check_idle.sh"
            exit 0
          fi
          echo "Esperando que el bucket esté disponible... intento $i de 6"
          sleep 5
        done
        
        echo "✗ Error: No se pudo acceder al bucket después de 30 segundos"
        exit 1

    - name: Verificar Despliegue
      if: success()
      run: |
        echo "Infraestructura desplegada correctamente"
        echo "Bucket S3: ${{ steps.bucket.outputs.bucket }}"
        echo "Región: ${{ env.AWS_REGION }}"

    - name: Cleanup on Failure
      if: failure()
      run: |
        echo "El despliegue falló. Iniciando limpieza..."
        cd terraform
        terraform destroy -auto-approve || true 