name: Deploy Application

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  TF_WORKSPACE: prod
  AWS_REGION: us-east-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: 1.5.0

    - name: Package Application
      run: |
        zip -r app.zip app/ scripts/ requirements.txt

    - name: Terraform Init
      id: init
      run: |
        cd terraform
        terraform init -input=false

    - name: Terraform Plan
      id: plan
      run: |
        cd terraform
        terraform plan -input=false -out=tfplan
      continue-on-error: true

    - name: Terraform Plan Status
      if: steps.plan.outcome == 'failure'
      run: exit 1

    - name: Terraform Apply
      id: apply
      run: |
        cd terraform
        terraform apply -auto-approve tfplan

    - name: Get S3 Bucket Name
      id: get-bucket
      run: |
        cd terraform
        BUCKET_NAME=$(terraform output -raw s3_bucket)
        echo "::set-output name=bucket::$BUCKET_NAME"

    - name: Upload Application to S3
      run: |
        BUCKET="${{ steps.get-bucket.outputs.bucket }}"
        if [ -z "$BUCKET" ]; then
          echo "Error: No se pudo obtener el nombre del bucket"
          exit 1
        fi
        
        echo "Subiendo archivos al bucket: $BUCKET"
        aws s3 cp app.zip "s3://$BUCKET/app.zip"
        aws s3 cp scripts/init.sh "s3://$BUCKET/init.sh"
        aws s3 cp scripts/check_idle.sh "s3://$BUCKET/check_idle.sh"

    - name: Verificar Despliegue
      run: |
        echo "Infraestructura desplegada correctamente"
        echo "Bucket S3: ${{ steps.get-bucket.outputs.bucket }}"
        echo "Región: ${{ env.AWS_REGION }}" 