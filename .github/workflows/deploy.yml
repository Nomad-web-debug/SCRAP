name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Create Lambda Layers
      run: |
        # Crear directorio base para las capas
        mkdir -p layers

        # 1. Capa Base
        echo "Creando capa Base..."
        mkdir -p layers/base/python
        pip install anthropic==0.18.1 requests==2.31.0 python-dotenv==1.0.1 boto3==1.34.34 -t layers/base/python
        cd layers/base && zip -r ../base.zip . && cd ../..
        aws lambda publish-layer-version --layer-name ClasificadorBase --zip-file fileb://layers/base.zip --compatible-runtimes python3.9

        # 2. Capa Processing
        echo "Creando capa Processing..."
        mkdir -p layers/processing/python
        pip install pandas==2.2.1 PyPDF2==3.0.1 beautifulsoup4==4.12.3 -t layers/processing/python
        cd layers/processing && zip -r ../processing.zip . && cd ../..
        aws lambda publish-layer-version --layer-name ClasificadorProcessing --zip-file fileb://layers/processing.zip --compatible-runtimes python3.9

        # 3. Capa ML
        echo "Creando capa ML..."
        mkdir -p layers/ml/python
        pip install numpy==1.26.4 transformers==4.38.2 -t layers/ml/python
        cd layers/ml && zip -r ../ml.zip . && cd ../..
        aws lambda publish-layer-version --layer-name ClasificadorML --zip-file fileb://layers/ml.zip --compatible-runtimes python3.9

        # 4. Capa PyTorch
        echo "Creando capa PyTorch..."
        mkdir -p layers/torch/python
        pip install torch --index-url https://download.pytorch.org/whl/cpu -t layers/torch/python
        cd layers/torch && zip -r ../torch.zip . && cd ../..
        aws lambda publish-layer-version --layer-name ClasificadorTorch --zip-file fileb://layers/torch.zip --compatible-runtimes python3.9

        # 5. Capa NLP
        echo "Creando capa NLP..."
        mkdir -p layers/nlp/python
        pip install sentence-transformers==2.5.1 -t layers/nlp/python
        cd layers/nlp && zip -r ../nlp.zip . && cd ../..
        aws lambda publish-layer-version --layer-name ClasificadorNLP --zip-file fileb://layers/nlp.zip --compatible-runtimes python3.9

    - name: Create deployment package
      run: |
        mkdir package
        cp -r *.py package/
        cd package && zip -r ../deployment.zip . && cd ..

    - name: Update Lambda Function
      run: |
        # Obtener los ARNs de las capas
        BASE_LAYER=$(aws lambda list-layer-versions --layer-name ClasificadorBase --query 'LayerVersions[0].LayerVersionArn' --output text)
        PROCESSING_LAYER=$(aws lambda list-layer-versions --layer-name ClasificadorProcessing --query 'LayerVersions[0].LayerVersionArn' --output text)
        ML_LAYER=$(aws lambda list-layer-versions --layer-name ClasificadorML --query 'LayerVersions[0].LayerVersionArn' --output text)
        TORCH_LAYER=$(aws lambda list-layer-versions --layer-name ClasificadorTorch --query 'LayerVersions[0].LayerVersionArn' --output text)
        NLP_LAYER=$(aws lambda list-layer-versions --layer-name ClasificadorNLP --query 'LayerVersions[0].LayerVersionArn' --output text)

        # Actualizar la función Lambda con todas las capas
        aws lambda update-function-code --function-name ClasificadorDocumentosIA --zip-file fileb://deployment.zip
        aws lambda update-function-configuration \
          --function-name ClasificadorDocumentosIA \
          --layers $BASE_LAYER $PROCESSING_LAYER $ML_LAYER $TORCH_LAYER $NLP_LAYER \
          --timeout 900 \
          --memory-size 2048

    - name: Create S3 Buckets
      run: |
        # Bucket para documentos originales
        aws s3api create-bucket \
          --bucket clasificador-docs-raw \
          --region us-east-2 \
          --create-bucket-configuration LocationConstraint=us-east-2 || true
        
        # Bucket para datos procesados
        aws s3api create-bucket \
          --bucket clasificador-docs-processed \
          --region us-east-2 \
          --create-bucket-configuration LocationConstraint=us-east-2 || true
        
        # Bucket para modelos entrenados
        aws s3api create-bucket \
          --bucket clasificador-models \
          --region us-east-2 \
          --create-bucket-configuration LocationConstraint=us-east-2 || true
        
        # Habilitar versionamiento
        for bucket in clasificador-docs-raw clasificador-docs-processed clasificador-models; do
          aws s3api put-bucket-versioning \
            --bucket $bucket \
            --versioning-configuration Status=Enabled
        done

    - name: Create DynamoDB Tables
      run: |
        # Tabla para metadatos de documentos
        aws dynamodb create-table \
          --table-name DocumentosMetadata \
          --attribute-definitions \
              AttributeName=id,AttributeType=S \
              AttributeName=fecha,AttributeType=S \
          --key-schema \
              AttributeName=id,KeyType=HASH \
              AttributeName=fecha,KeyType=RANGE \
          --provisioned-throughput \
              ReadCapacityUnits=5,WriteCapacityUnits=5 || true
        
        # Tabla para datos de entrenamiento
        aws dynamodb create-table \
          --table-name TrainingData \
          --attribute-definitions \
              AttributeName=id,AttributeType=S \
          --key-schema \
              AttributeName=id,KeyType=HASH \
          --provisioned-throughput \
              ReadCapacityUnits=5,WriteCapacityUnits=5 || true
        
        # Tabla para chat
        aws dynamodb create-table \
          --table-name ChatHistory \
          --attribute-definitions \
              AttributeName=session_id,AttributeType=S \
              AttributeName=timestamp,AttributeType=N \
          --key-schema \
              AttributeName=session_id,KeyType=HASH \
              AttributeName=timestamp,KeyType=RANGE \
          --provisioned-throughput \
              ReadCapacityUnits=5,WriteCapacityUnits=5 || true

    - name: Create SageMaker Notebook
      run: |
        aws sagemaker create-notebook-instance \
          --notebook-instance-name ClasificadorNotebook \
          --instance-type ml.t3.medium \
          --role-arn arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/service-role/AmazonSageMaker-ExecutionRole \
          --volume-size-in-gb 50 || true

    - name: Create API Gateway
      run: |
        # Crear API REST
        api_id=$(aws apigateway create-rest-api \
          --name ClasificadorAPI \
          --description "API para el clasificador de documentos" \
          --query 'id' --output text || true) 