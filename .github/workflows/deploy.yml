name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create deployment package
      run: |
        # Crear directorio temporal para el paquete
        mkdir -p package
        # Copiar archivos necesarios
        cp lambda_function.py package/
        cp requirements.txt package/
        # Instalar dependencias en el directorio del paquete
        cd package
        pip install --target . -r requirements.txt
        # Crear el archivo ZIP excluyendo archivos innecesarios
        zip -r9 ../deployment.zip ./* -x "*.pyc" -x "*.pyo" -x "*.dist-info/*" -x "__pycache__/*"
        cd ..
        
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2
        
    - name: Upload to S3
      run: |
        # Crear bucket si no existe (ignora error si ya existe)
        aws s3api create-bucket \
          --bucket clasificador-documentos-ia-deployment \
          --region us-east-2 \
          --create-bucket-configuration LocationConstraint=us-east-2 || true
        
        # Subir archivo a S3
        aws s3 cp deployment.zip s3://clasificador-documentos-ia-deployment/
        
    - name: Update Lambda from S3
      run: |
        aws lambda update-function-code \
          --function-name ClasificadorDocumentosIA \
          --s3-bucket clasificador-documentos-ia-deployment \
          --s3-key deployment.zip 