name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: |
          requirements-lambda.txt
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel setuptools

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Create Lambda Layers
      run: |
        # Función auxiliar para comprimir directorios
        compress_layer() {
          local dir=$1
          local zip_file=$2
          cd "$dir"
          find . -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "docs" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          find . -type f -name "*.pyo" -delete 2>/dev/null || true
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.so" ! -name "*cpython*.so" -delete 2>/dev/null || true
          zip -r9 "../$zip_file" . -x "*.pyc" "*.pyo" "*/__pycache__/*" "*.dist-info/*" "*.egg-info/*"
          cd ..
        }

        # Función para publicar capa
        publish_layer() {
          local name=$1
          local zip_file=$2
          local size=$(stat -c%s "$zip_file")
          echo "Tamaño de $name: $size bytes"
          
          if [ $size -gt 50000000 ]; then
            echo "Error: La capa $name es demasiado grande ($size bytes)"
            return 1
          fi
          
          local arn=$(aws lambda publish-layer-version \
            --layer-name "$name" \
            --region us-east-2 \
            --description "Layer for $name" \
            --zip-file "fileb://$zip_file" \
            --compatible-runtimes python3.12 \
            --query 'LayerVersionArn' \
            --output text)
          
          echo "$name=$arn" >> $GITHUB_ENV
          echo "Capa $name publicada: $arn"
        }

        # 1. Capa Base (dependencias ligeras)
        echo "Creando capa base..."
        mkdir -p base_layer/python
        cd base_layer/python
        pip install \
          --platform manylinux2014_x86_64 \
          --target . \
          --implementation cp \
          --python-version 3.12 \
          --only-binary=:all: \
          anthropic==0.18.1 \
          requests==2.31.0 \
          python-dotenv==1.0.1 \
          boto3==1.34.34
        cd ../..
        compress_layer base_layer/python base_layer.zip
        publish_layer "ClasificadorBase" "base_layer.zip"

        # 2. Capa de Procesamiento (pandas y PDF)
        echo "Creando capa de procesamiento..."
        mkdir -p processing_layer/python
        cd processing_layer/python
        pip install \
          --platform manylinux2014_x86_64 \
          --target . \
          --implementation cp \
          --python-version 3.12 \
          --only-binary=:all: \
          pandas==2.2.1 \
          PyPDF2==3.0.1 \
          beautifulsoup4==4.12.3
        cd ../..
        compress_layer processing_layer/python processing_layer.zip
        publish_layer "ClasificadorProcessing" "processing_layer.zip"

        # 3. Capa ML (numpy y transformers)
        echo "Creando capa ML..."
        mkdir -p ml_layer/python
        cd ml_layer/python
        pip install \
          --platform manylinux2014_x86_64 \
          --target . \
          --implementation cp \
          --python-version 3.12 \
          --only-binary=:all: \
          numpy==1.26.4 \
          transformers==4.38.2
        cd ../..
        compress_layer ml_layer/python ml_layer.zip
        publish_layer "ClasificadorML" "ml_layer.zip"

        # 4. Capa PyTorch (solo componentes esenciales)
        echo "Creando capa PyTorch..."
        mkdir -p torch_layer/python
        cd torch_layer/python
        pip install \
          --platform manylinux2014_x86_64 \
          --target . \
          --implementation cp \
          --python-version 3.12 \
          --only-binary=:all: \
          --no-deps \
          torch==2.2.1+cpu \
          -f https://download.pytorch.org/whl/cpu/torch_stable.html
        # Limpiar componentes no esenciales de PyTorch
        rm -rf torch/test torch/testing torch/utils/test_module.py
        cd ../..
        compress_layer torch_layer/python torch_layer.zip
        publish_layer "ClasificadorTorch" "torch_layer.zip"

        # 5. Capa NLP (sentence-transformers)
        echo "Creando capa NLP..."
        mkdir -p nlp_layer/python
        cd nlp_layer/python
        pip install \
          --platform manylinux2014_x86_64 \
          --target . \
          --implementation cp \
          --python-version 3.12 \
          --only-binary=:all: \
          --no-deps \
          sentence-transformers==2.5.1
        cd ../..
        compress_layer nlp_layer/python nlp_layer.zip
        publish_layer "ClasificadorNLP" "nlp_layer.zip"

    - name: Create deployment package
      run: |
        # Crear directorio temporal para el paquete
        mkdir -p package
        
        # Copiar archivos necesarios
        cp lambda_function.py package/
        cp scraper.py package/
        cp processor.py package/
        cp database.py package/
        cp storage.py package/
        
        cd package
        
        # Instalar solo dependencias ligeras
        pip install \
          --platform manylinux2014_x86_64 \
          --target . \
          --implementation cp \
          --python-version 3.12 \
          --only-binary=:all: \
          boto3==1.34.34 \
          pandas==2.2.1 \
          PyPDF2==3.0.1 \
          beautifulsoup4==4.12.3
        
        # Limpiar archivos innecesarios
        find . -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
        find . -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
        find . -type d -name "docs" -exec rm -rf {} + 2>/dev/null || true
        find . -type f -name "*.pyc" -delete 2>/dev/null || true
        find . -type f -name "*.pyo" -delete 2>/dev/null || true
        find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
        
        # Crear ZIP del paquete principal
        zip -r9 ../deployment.zip . -x "*.pyc" "*.pyo" "*/__pycache__/*" "*.dist-info/*" "*.egg-info/*"
        cd ..

    - name: Update Lambda Function
      run: |
        # Verificar que todas las capas se crearon correctamente
        if [ -z "$ClasificadorBase" ] || [ -z "$ClasificadorProcessing" ] || [ -z "$ClasificadorML" ] || [ -z "$ClasificadorTorch" ] || [ -z "$ClasificadorNLP" ]; then
          echo "Error: No se crearon todas las capas necesarias"
          exit 1
        fi
        
        # Actualizar función Lambda con todas las capas
        aws lambda update-function-configuration \
          --function-name ClasificadorDocumentosIA \
          --layers "$ClasificadorBase" "$ClasificadorProcessing" "$ClasificadorML" "$ClasificadorTorch" "$ClasificadorNLP" \
          --timeout 900 \
          --memory-size 2048 \
          --environment "Variables={
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }},
            S3_BUCKET=clasificador-docs-raw,
            DYNAMODB_METADATA_TABLE=DocumentosMetadata,
            DYNAMODB_TRAINING_TABLE=TrainingData,
            DYNAMODB_CHAT_TABLE=ChatHistory
          }"

    - name: Create S3 Buckets
      run: |
        # Bucket para documentos originales
        aws s3api create-bucket \
          --bucket clasificador-docs-raw \
          --region us-east-2 \
          --create-bucket-configuration LocationConstraint=us-east-2 || true
        
        # Bucket para datos procesados
        aws s3api create-bucket \
          --bucket clasificador-docs-processed \
          --region us-east-2 \
          --create-bucket-configuration LocationConstraint=us-east-2 || true
        
        # Bucket para modelos entrenados
        aws s3api create-bucket \
          --bucket clasificador-models \
          --region us-east-2 \
          --create-bucket-configuration LocationConstraint=us-east-2 || true
        
        # Habilitar versionamiento
        for bucket in clasificador-docs-raw clasificador-docs-processed clasificador-models; do
          aws s3api put-bucket-versioning \
            --bucket $bucket \
            --versioning-configuration Status=Enabled
        done

    - name: Create DynamoDB Tables
      run: |
        # Tabla para metadatos de documentos
        aws dynamodb create-table \
          --table-name DocumentosMetadata \
          --attribute-definitions \
              AttributeName=id,AttributeType=S \
              AttributeName=fecha,AttributeType=S \
          --key-schema \
              AttributeName=id,KeyType=HASH \
              AttributeName=fecha,KeyType=RANGE \
          --provisioned-throughput \
              ReadCapacityUnits=5,WriteCapacityUnits=5 || true
        
        # Tabla para datos de entrenamiento
        aws dynamodb create-table \
          --table-name TrainingData \
          --attribute-definitions \
              AttributeName=id,AttributeType=S \
          --key-schema \
              AttributeName=id,KeyType=HASH \
          --provisioned-throughput \
              ReadCapacityUnits=5,WriteCapacityUnits=5 || true
        
        # Tabla para chat
        aws dynamodb create-table \
          --table-name ChatHistory \
          --attribute-definitions \
              AttributeName=session_id,AttributeType=S \
              AttributeName=timestamp,AttributeType=N \
          --key-schema \
              AttributeName=session_id,KeyType=HASH \
              AttributeName=timestamp,KeyType=RANGE \
          --provisioned-throughput \
              ReadCapacityUnits=5,WriteCapacityUnits=5 || true

    - name: Create SageMaker Notebook
      run: |
        aws sagemaker create-notebook-instance \
          --notebook-instance-name ClasificadorNotebook \
          --instance-type ml.t3.medium \
          --role-arn arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/service-role/AmazonSageMaker-ExecutionRole \
          --volume-size-in-gb 50 || true

    - name: Create API Gateway
      run: |
        # Crear API REST
        api_id=$(aws apigateway create-rest-api \
          --name ClasificadorAPI \
          --description "API para el clasificador de documentos" \
          --query 'id' --output text || true) 