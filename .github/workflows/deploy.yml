name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create deployment package
      run: |
        # Crear directorio temporal para el paquete
        mkdir -p package
        # Copiar archivos necesarios
        cp lambda_function.py package/
        cp requirements.txt package/
        cd package
        
        # Instalar solo las dependencias necesarias sin archivos extra
        pip install \
          --platform manylinux2014_x86_64 \
          --target . \
          --implementation cp \
          --python-version 3.12 \
          --only-binary=:all: \
          -r requirements.txt
        
        # Limpiar archivos innecesarios
        find . -type d -name "tests" -exec rm -rf {} +
        find . -type d -name "test" -exec rm -rf {} +
        find . -type d -name "docs" -exec rm -rf {} +
        find . -type f -name "*.pyc" -delete
        find . -type f -name "*.pyo" -delete
        find . -type d -name "__pycache__" -exec rm -rf {} +
        find . -type d -name "*.dist-info" -exec rm -rf {} +
        find . -type d -name "*.egg-info" -exec rm -rf {} +
        
        # Crear ZIP optimizado
        zip -r9 ../deployment.zip ./* \
          --exclude "*.pyc" \
          --exclude "*.pyo" \
          --exclude "*/__pycache__/*" \
          --exclude "*.dist-info/*" \
          --exclude "*.egg-info/*" \
          --exclude "*/tests/*" \
          --exclude "*/test/*" \
          --exclude "*/docs/*"
        
        cd ..
        
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2
        
    - name: Upload to S3
      run: |
        # Crear bucket si no existe (ignora error si ya existe)
        aws s3api create-bucket \
          --bucket clasificador-documentos-ia-deployment \
          --region us-east-2 \
          --create-bucket-configuration LocationConstraint=us-east-2 || true
        
        # Subir archivo a S3
        aws s3 cp deployment.zip s3://clasificador-documentos-ia-deployment/
        
    - name: Update Lambda from S3
      run: |
        aws lambda update-function-code \
          --function-name ClasificadorDocumentosIA \
          --s3-bucket clasificador-documentos-ia-deployment \
          --s3-key deployment.zip 