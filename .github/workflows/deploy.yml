name: Deploy Application

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  TF_WORKSPACE: prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: 1.5.0

    - name: Package Application
      run: |
        zip -r app.zip app/ scripts/ requirements.txt

    - name: Terraform Init
      id: init
      run: |
        cd terraform
        terraform init -input=false

    - name: Terraform Plan
      id: plan
      run: |
        cd terraform
        terraform plan -input=false -out=tfplan
      continue-on-error: true

    - name: Terraform Plan Status
      if: steps.plan.outcome == 'failure'
      run: exit 1

    - name: Terraform Apply
      id: apply
      run: |
        cd terraform
        terraform apply -auto-approve tfplan
        BUCKET_NAME=$(terraform output -raw s3_bucket || echo "")
        if [ -n "$BUCKET_NAME" ]; then
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_ENV
        else
          echo "Error: No se pudo obtener el nombre del bucket"
          exit 1
        fi

    - name: Upload Application to S3
      if: success()
      run: |
        if [ -n "${{ env.bucket_name }}" ]; then
          aws s3 cp app.zip "s3://${{ env.bucket_name }}/"
          aws s3 cp scripts/init.sh "s3://${{ env.bucket_name }}/"
          aws s3 cp scripts/check_idle.sh "s3://${{ env.bucket_name }}/"
        else
          echo "Error: Nombre del bucket no disponible"
          exit 1
        fi 