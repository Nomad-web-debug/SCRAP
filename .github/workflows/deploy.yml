name: Despliegue y Procesamiento

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      fase:
        description: 'Fase a ejecutar (deploy, scrape, process, all)'
        required: true
        default: 'all'
        type: choice
        options:
        - deploy
        - scrape
        - process
        - all

env:
  TF_WORKSPACE: prod
  AWS_REGION: us-east-2
  # Aunque el secreto se llama OPENAI_API_KEY, contiene la clave de Claude (Anthropic)
  ANTHROPIC_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  deploy-and-process:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    # === FASE DE DESPLIEGUE ===
    - name: Configurar AWS
      if: github.event.inputs.fase == 'deploy' || github.event.inputs.fase == 'all' || github.event.inputs.fase == null
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Configurar Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install anthropic boto3 PyPDF2 beautifulsoup4 requests

    - name: Configurar Terraform
      if: github.event.inputs.fase == 'deploy' || github.event.inputs.fase == 'all' || github.event.inputs.fase == null
      uses: hashicorp/setup-terraform@v1

    - name: Terraform Init
      if: github.event.inputs.fase == 'deploy' || github.event.inputs.fase == 'all' || github.event.inputs.fase == null
      working-directory: ./terraform
      run: terraform init

    - name: Terraform Plan
      if: github.event.inputs.fase == 'deploy' || github.event.inputs.fase == 'all' || github.event.inputs.fase == null
      working-directory: ./terraform
      run: terraform plan -out=tfplan

    - name: Terraform Apply
      if: github.event.inputs.fase == 'deploy' || github.event.inputs.fase == 'all' || github.event.inputs.fase == null
      working-directory: ./terraform
      run: terraform apply -auto-approve tfplan

    - name: Obtener Nombre del Bucket
      id: bucket
      working-directory: ./terraform
      shell: bash
      run: |
        # Obtener y limpiar el nombre del bucket
        BUCKET_NAME=$(terraform output s3_bucket | sed -n 's/^"\(.*\)"$/\1/p')
        
        if [[ -n "$BUCKET_NAME" ]]; then
          echo "bucket=$BUCKET_NAME" >> "$GITHUB_OUTPUT"
          echo "Nombre del bucket obtenido: $BUCKET_NAME"
        else
          echo "Error: No se pudo obtener el nombre del bucket"
          terraform output
          exit 1
        fi

    # === FASE DE SCRAPING ===
    - name: Verificar API de Claude
      if: (github.event.inputs.fase == 'scrape' || github.event.inputs.fase == 'all' || github.event.inputs.fase == null) && success()
      env:
        BUCKET_NAME: ${{ steps.bucket.outputs.bucket }}
      run: |
        if [ -z "$BUCKET_NAME" ]; then
          echo "Error: BUCKET_NAME no está definido"
          exit 1
        fi
        
        python -c "
        import anthropic
        import os
        import sys
        
        try:
            client = anthropic.Client(api_key=os.getenv('ANTHROPIC_API_KEY'))
            response = client.messages.create(
                model='claude-3-sonnet-20240229',
                max_tokens=10,
                messages=[{
                    'role': 'user',
                    'content': 'Di hola'
                }]
            )
            print('API de Claude funcionando correctamente')
        except Exception as e:
            print(f'Error al verificar API de Claude: {str(e)}')
            sys.exit(1)
        "

    - name: Ejecutar Scraping
      if: (github.event.inputs.fase == 'scrape' || github.event.inputs.fase == 'all' || github.event.inputs.fase == null) && success()
      env:
        BUCKET_NAME: ${{ steps.bucket.outputs.bucket }}
      run: |
        echo "Iniciando scraping..."
        
        # Instalar Chromium y ChromeDriver
        sudo apt-get update
        sudo apt-get install -y chromium chromium-driver xvfb
        
        # Configurar display virtual
        export DISPLAY=:99
        sudo Xvfb :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
        
        # Verificar instalación
        which chromium
        chromium --version || true
        which chromedriver
        chromedriver --version || true
        
        # Instalar dependencias de Python
        pip install selenium webdriver_manager
        
        # Ejecutar scraping
        python scripts/scraper.py
        
        # Verificar resultados
        python -c "
        import boto3
        import os
        import json
        from datetime import datetime, timedelta
        
        s3 = boto3.client('s3')
        bucket = os.getenv('BUCKET_NAME')
        
        # Verificar archivos nuevos (últimos 5 minutos)
        now = datetime.now()
        cutoff = now - timedelta(minutes=5)
        
        # Verificar metadata
        meta_response = s3.list_objects_v2(Bucket=bucket, Prefix='metadata/')
        if 'Contents' in meta_response:
            recent_meta = [obj for obj in meta_response['Contents'] 
                         if obj['LastModified'].replace(tzinfo=None) > cutoff]
            if not recent_meta:
                print('No se encontraron metadatos recientes')
                exit(1)
            
            # Leer último archivo de metadata
            latest_meta = max(recent_meta, key=lambda x: x['LastModified'])
            content = s3.get_object(Bucket=bucket, Key=latest_meta['Key'])
            data = json.loads(content['Body'].read())
            
            print(f'Documentos encontrados: {data.get("total", 0)}')
            if data.get('total', 0) == 0:
                print('No se encontraron documentos')
                exit(1)
        else:
            print('No se encontraron archivos de metadata')
            exit(1)
        "

    # === FASE DE PROCESAMIENTO ===
    - name: Procesar Documentos
      if: (github.event.inputs.fase == 'process' || github.event.inputs.fase == 'all' || github.event.inputs.fase == null) && success()
      env:
        BUCKET_NAME: ${{ steps.bucket.outputs.bucket }}
        ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
      run: |
        echo "Verificando archivos antes del procesamiento..."
        python -c "
        import boto3
        import os
        
        s3 = boto3.client('s3')
        bucket = os.getenv('BUCKET_NAME')
        
        # Verificar archivos raw
        raw = s3.list_objects_v2(Bucket=bucket, Prefix='raw/')
        if 'Contents' not in raw or len(raw['Contents']) == 0:
            print('No hay archivos para procesar')
            exit(1)
            
        print(f'Encontrados {len(raw["Contents"])} archivos para procesar')
        "
        
        echo "Iniciando procesamiento..."
        python scripts/processor.py

    - name: Verificar Errores
      if: always()
      env:
        BUCKET_NAME: ${{ steps.bucket.outputs.bucket }}
      run: |
        if [ -z "$BUCKET_NAME" ]; then
          echo "Error: BUCKET_NAME no está definido"
          exit 1
        fi
        
        echo "Verificando bucket: $BUCKET_NAME"
        
        python -c "
        import boto3
        import os
        import json
        from datetime import datetime
        
        def save_status(bucket, status):
            try:
                s3 = boto3.client('s3')
                status_obj = {
                    'timestamp': datetime.now().isoformat(),
                    'status': status,
                    'bucket': bucket
                }
                s3.put_object(
                    Bucket=bucket,
                    Key='status/last_run.json',
                    Body=json.dumps(status_obj),
                    ContentType='application/json'
                )
            except Exception as e:
                print(f'Error guardando estado: {str(e)}')
        
        bucket = os.getenv('BUCKET_NAME')
        print(f'Verificando bucket: {bucket}')
        
        try:
            s3 = boto3.client('s3')
            s3.head_bucket(Bucket=bucket)
            print(f'Bucket {bucket} existe y es accesible')
            
            # Verificar errores
            response = s3.list_objects_v2(Bucket=bucket, Prefix='errors/')
            errors = list(response.get('Contents', []))
            
            if errors:
                print('Se encontraron errores:')
                for error in errors:
                    print(f'- {error["Key"]}')
                save_status(bucket, 'error')
                exit(1)
            else:
                print('No se encontraron errores')
                save_status(bucket, 'success')
                
        except Exception as e:
            print(f'Error al verificar errores: {str(e)}')
            save_status(bucket, 'error')
            exit(1)
        " 