name: Despliegue y Procesamiento

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  TF_WORKSPACE: prod
  AWS_REGION: us-east-2
  # Aunque el secreto se llama OPENAI_API_KEY, contiene la clave de Claude (Anthropic)
  ANTHROPIC_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  deploy-and-process:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Configurar AWS
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Configurar Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install anthropic boto3 sqlalchemy psycopg2-binary tenacity PyPDF2

    - name: Configurar Terraform
      uses: hashicorp/setup-terraform@v1

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init

    - name: Terraform Plan
      working-directory: ./terraform
      run: terraform plan -out=tfplan

    - name: Terraform Apply
      working-directory: ./terraform
      run: terraform apply -auto-approve tfplan

    - name: Obtener Nombre del Bucket
      id: bucket
      working-directory: ./terraform
      run: |
        # Obtener el nombre del bucket directamente del output
        BUCKET_NAME=$(terraform output -raw s3_bucket)
        echo "Valor inicial del bucket: $BUCKET_NAME"
        
        # Verificar si se obtuvo el nombre
        if [ -z "$BUCKET_NAME" ]; then
          echo "Error: No se pudo obtener el nombre del bucket"
          terraform output
          exit 1
        fi
        
        # Guardar el nombre del bucket como variable de entorno y output
        echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
        echo "bucket=$BUCKET_NAME" >> $GITHUB_OUTPUT
        echo "Nombre del bucket obtenido: $BUCKET_NAME"

    - name: Verificar API de Claude
      if: success()
      env:
        BUCKET_NAME: ${{ env.BUCKET_NAME }}
      run: |
        if [ -z "$BUCKET_NAME" ]; then
          echo "Error: BUCKET_NAME no está definido"
          exit 1
        fi
        
        python -c "
        import anthropic
        import os
        import sys
        
        try:
            client = anthropic.Client(api_key=os.getenv('ANTHROPIC_API_KEY'))
            response = client.messages.create(
                model='claude-3-sonnet-20240229',
                max_tokens=10,
                messages=[{
                    'role': 'user',
                    'content': 'Di hola'
                }]
            )
            print('API de Claude funcionando correctamente')
        except Exception as e:
            print(f'Error al verificar API de Claude: {str(e)}')
            sys.exit(1)
        "

    - name: Procesar PDFs
      if: success()
      env:
        BUCKET_NAME: ${{ env.BUCKET_NAME }}
      run: |
        if [ -z "$BUCKET_NAME" ]; then
          echo "Error: BUCKET_NAME no está definido"
          exit 1
        fi
        
        echo "Usando bucket: $BUCKET_NAME"
        python -c "
        import boto3
        import os
        from datetime import datetime
        import json
        from io import BytesIO
        import PyPDF2
        
        def process_pdf(s3_client, bucket, key):
            try:
                print(f'Procesando {key}...')
                response = s3_client.get_object(Bucket=bucket, Key=key)
                pdf_file = BytesIO(response['Body'].read())
                reader = PyPDF2.PdfReader(pdf_file)
                
                text_content = []
                for page in reader.pages:
                    text_content.append(page.extract_text())
                
                # Guardar contenido extraído
                output_key = f'extracted/{os.path.basename(key)}.json'
                s3_client.put_object(
                    Bucket=bucket,
                    Key=output_key,
                    Body=json.dumps({
                        'filename': key,
                        'text_content': text_content,
                        'num_pages': len(reader.pages),
                        'processed_at': datetime.now().isoformat()
                    }),
                    ContentType='application/json'
                )
                print(f'PDF procesado exitosamente: {key}')
                return True
            except Exception as e:
                print(f'Error procesando {key}: {str(e)}')
                return False
        
        def main():
            s3 = boto3.client('s3')
            bucket = os.getenv('BUCKET_NAME')
            if not bucket:
                print('Error: BUCKET_NAME no está definido')
                exit(1)
            
            # Procesar PDFs
            try:
                response = s3.list_objects_v2(Bucket=bucket, Prefix='raw/')
                if 'Contents' in response:
                    for obj in response['Contents']:
                        if obj['Key'].endswith('.pdf'):
                            process_pdf(s3, bucket, obj['Key'])
                else:
                    print('No se encontraron PDFs para procesar')
            except Exception as e:
                print(f'Error listando objetos: {str(e)}')
                exit(1)
        
        if __name__ == '__main__':
            main()
        "

    - name: Categorizar Contenido
      if: success()
      env:
        BUCKET_NAME: ${{ env.BUCKET_NAME }}
      run: |
        if [ -z "$BUCKET_NAME" ]; then
          echo "Error: BUCKET_NAME no está definido"
          exit 1
        fi
        
        echo "Usando bucket: $BUCKET_NAME"
        python -c "
        import anthropic
        import boto3
        import json
        import os
        from datetime import datetime
        
        def categorize_text(client, text):
            try:
                response = client.messages.create(
                    model='claude-3-sonnet-20240229',
                    max_tokens=1000,
                    messages=[{
                        'role': 'user',
                        'content': f'''Analiza el siguiente texto y extrae:
                        1. Categoría principal
                        2. Subcategorías
                        3. Palabras clave
                        4. Resumen ejecutivo
                        
                        Texto:
                        {text[:2000]}...
                        '''
                    }]
                )
                return response.content
            except Exception as e:
                print(f'Error en categorización: {str(e)}')
                return None
        
        def main():
            s3 = boto3.client('s3')
            claude = anthropic.Client(api_key=os.getenv('ANTHROPIC_API_KEY'))
            bucket = os.getenv('BUCKET_NAME')
            
            try:
                # Procesar archivos extraídos
                response = s3.list_objects_v2(Bucket=bucket, Prefix='extracted/')
                if 'Contents' in response:
                    for obj in response['Contents']:
                        if obj['Key'].endswith('.json'):
                            print(f'Categorizando {obj["Key"]}...')
                            
                            # Leer contenido extraído
                            content = s3.get_object(Bucket=bucket, Key=obj['Key'])
                            data = json.loads(content['Body'].read())
                            
                            # Categorizar con Claude
                            text = ' '.join(data['text_content'])
                            categorization = categorize_text(claude, text)
                            
                            if categorization:
                                # Guardar resultados
                                output_key = f'categorized/{os.path.basename(obj["Key"])}'
                                s3.put_object(
                                    Bucket=bucket,
                                    Key=output_key,
                                    Body=json.dumps({
                                        'original_file': data['filename'],
                                        'categorization': categorization,
                                        'processed_at': datetime.now().isoformat()
                                    }),
                                    ContentType='application/json'
                                )
                                print(f'Categorización completada: {obj["Key"]}')
                else:
                    print('No se encontraron archivos para categorizar')
                    
            except Exception as e:
                print(f'Error en el proceso: {str(e)}')
                exit(1)
        
        if __name__ == '__main__':
            main()
        "

    - name: Verificar Errores
      if: always()
      env:
        BUCKET_NAME: ${{ env.BUCKET_NAME }}
      run: |
        if [ -z "$BUCKET_NAME" ]; then
          echo "Error: BUCKET_NAME no está definido"
          exit 1
        fi
        
        echo "Verificando bucket: $BUCKET_NAME"
        
        python -c "
        import boto3
        import os
        
        bucket = os.getenv('BUCKET_NAME')
        print(f'Verificando bucket: {bucket}')
        
        try:
            s3 = boto3.client('s3')
            # Verificar si el bucket existe
            s3.head_bucket(Bucket=bucket)
            print(f'Bucket {bucket} existe y es accesible')
            
            # Verificar errores
            response = s3.list_objects_v2(Bucket=bucket, Prefix='errors/')
            errors = list(response.get('Contents', []))
            
            if errors:
                print('Se encontraron errores:')
                for error in errors:
                    print(f'- {error[\"Key\"]}')
                exit(1)
            else:
                print('No se encontraron errores')
                
        except Exception as e:
            print(f'Error al verificar errores: {str(e)}')
            exit(1)
        " 