name: Configurar Endpoint SageMaker

on:
  workflow_dispatch:
    inputs:
      modelo_llama:
        description: 'Selecciona el modelo de Llama 2'
        required: true
        type: choice
        options:
          - 'Llama 2 7B - Ligero y económico (ml.g4dn.xlarge)'
          - 'Llama 2 13B - Balance rendimiento/costo (ml.g4dn.xlarge)'
          - 'Llama 2 70B - Máxima potencia (ml.g5.12xlarge)'
        default: 'Llama 2 13B - Balance rendimiento/costo (ml.g4dn.xlarge)'

jobs:
  setup-endpoint:
    runs-on: ubuntu-latest
    
    env:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      HUGGINGFACE_HUB_TOKEN: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
      
    steps:
    - uses: actions/checkout@v3
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install boto3
        
    - name: Verificar token de Hugging Face
      run: |
        if [ -z "$HUGGINGFACE_HUB_TOKEN" ]; then
          echo "Error: HUGGINGFACE_HUB_TOKEN no está configurado"
          echo "Por favor, configura el token en los secrets del repositorio"
          exit 1
        fi
        
    - name: Configurar modelo seleccionado
      run: |
        # Extraer versión del modelo del input
        if [[ "${{ github.event.inputs.modelo_llama }}" == *"7B"* ]]; then
          echo "MODELO_VERSION=7b" >> $GITHUB_ENV
        elif [[ "${{ github.event.inputs.modelo_llama }}" == *"13B"* ]]; then
          echo "MODELO_VERSION=13b" >> $GITHUB_ENV
        else
          echo "MODELO_VERSION=70b" >> $GITHUB_ENV
        fi
        
    - name: Configurar Endpoint SageMaker
      run: python scripts/setup_sagemaker.py --modelo ${{ env.MODELO_VERSION }} 
      
    - name: Subir archivo de estado
      run: |
        git config --global user.email "github-actions@github.com"
        git config --global user.name "GitHub Actions"
        git add data/endpoint_state.json
        git commit -m "Actualizar estado del endpoint SageMaker"
        git push 