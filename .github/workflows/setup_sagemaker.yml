name: Configurar Endpoint SageMaker

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: 'Región de AWS (default: us-east-1)'
        required: true
        default: 'us-east-1'

permissions:
  id-token: write
  contents: read

jobs:
  setup-endpoint:
    runs-on: ubuntu-latest
    
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install boto3
    
    - name: Verificar credenciales AWS
      run: |
        if [ -z "$AWS_REGION" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
          echo "Error: Faltan credenciales de AWS"
          exit 1
        fi
    
    - name: Configurar endpoint de SageMaker
      run: |
        python scripts/setup_sagemaker.py 