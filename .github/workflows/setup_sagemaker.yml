name: Configurar Endpoint SageMaker

on:
  workflow_dispatch:
    inputs:
      instance_type:
        description: 'Tipo de instancia SageMaker (ej: ml.g4dn.xlarge)'
        required: true
        default: 'ml.g4dn.xlarge'

env:
  AWS_DEFAULT_REGION: us-east-1
  AWS_REGION: us-east-1

jobs:
  setup-endpoint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
        
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install boto3 requests

    - name: Configurar endpoint de SageMaker
      env:
        SAGEMAKER_INSTANCE_TYPE: ${{ github.event.inputs.instance_type }}
      run: python scripts/setup_sagemaker.py 