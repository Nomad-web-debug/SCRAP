name: 2. Extract PDF Information

on:
  workflow_run:
    workflows: ["1. Deploy Infrastructure"]
    types:
      - completed
  workflow_dispatch:

env:
  AWS_REGION: us-east-2

jobs:
  extract-info:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
    - uses: actions/checkout@v2

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install PyPDF2 boto3

    - name: Extract PDF Information
      env:
        BUCKET_NAME: ${{ needs.deploy.outputs.bucket }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        python -c "
        import boto3
        import PyPDF2
        import os
        import json
        from io import BytesIO
        
        def extract_pdf_info(s3_client, bucket, key):
            try:
                # Descargar PDF de S3
                response = s3_client.get_object(Bucket=bucket, Key=key)
                pdf_file = BytesIO(response['Body'].read())
                
                # Extraer texto y metadata
                reader = PyPDF2.PdfReader(pdf_file)
                
                # Extraer información básica
                info = {
                    'filename': key.split('/')[-1],
                    'num_pages': len(reader.pages),
                    'metadata': reader.metadata,
                    'text_content': {},
                    'extraction_date': datetime.now().isoformat()
                }
                
                # Extraer texto por página
                for i, page in enumerate(reader.pages):
                    info['text_content'][f'page_{i+1}'] = page.extract_text()
                
                # Guardar en S3
                output_key = key.replace('raw/', 'extracted/')
                output_key = output_key.rsplit('.', 1)[0] + '.json'
                
                s3_client.put_object(
                    Bucket=bucket,
                    Key=output_key,
                    Body=json.dumps(info, ensure_ascii=False),
                    ContentType='application/json'
                )
                
                return True
                
            except Exception as e:
                print(f'Error procesando {key}: {str(e)}')
                return False
        
        def process_all_pdfs():
            s3 = boto3.client('s3')
            bucket = os.getenv('BUCKET_NAME')
            
            # Listar todos los PDFs en raw/
            paginator = s3.get_paginator('list_objects_v2')
            for page in paginator.paginate(Bucket=bucket, Prefix='raw/'):
                for obj in page.get('Contents', []):
                    if obj['Key'].endswith('.pdf'):
                        print(f'Procesando {obj["Key"]}...')
                        extract_pdf_info(s3, bucket, obj['Key'])
        
        if __name__ == '__main__':
            process_all_pdfs()
        "

    - name: Upload Extraction Logs
      if: always()
      run: |
        aws s3 cp extraction_results.log s3://${{ needs.deploy.outputs.bucket }}/logs/
      continue-on-error: true 